<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><title>リユースお宝発見</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script></head><body><main class="app"><header><h1>🔎 リユースお宝発見</h1><p>棚を1枚撮るだけ。気になる物をまとめて調べよう。</p></header><section id="home" class="card"><div class="camera-box"><video id="video" autoplay playsinline muted></video><img id="preview" alt="撮影した棚写真"><div id="cameraHint">カメラを起動して棚を写してください</div></div><div class="actions"><button id="startCamera" class="primary">📷 カメラを起動</button><button id="takePhoto" class="primary" disabled>撮影する</button><label class="secondary">写真を選ぶ<input id="fileInput" type="file" accept="image/*" hidden></label></div><canvas id="canvas" hidden></canvas><button id="analyze" class="wide" disabled>この写真を一括調査する</button><p class="note">※ 無料のブラウザだけで動く試作版です。写真はこの端末内で扱います。</p></section><section id="results" hidden><div class="sectionHead"><h2>調査結果</h2><button id="newSearch" class="small">新しく調べる</button></div><div id="resultList"></div></section><section id="detail" hidden><button id="back" class="back">← 検索結果一覧へ戻る</button><div id="detailBody"></div></section></main><script src="./app.js"></script></body></html>
