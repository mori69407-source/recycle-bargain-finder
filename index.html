<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><title>リユースお宝発見</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><h1>🔎 リユースお宝発見</h1><p>まずは商品1個の撮影とAI解析を確認します。</p></header><section id="home" class="card"><div class="camera-box"><video id="video" autoplay playsinline muted></video><img id="preview" alt="撮影した商品"><div id="cameraHint">商品を1個写してください</div></div><div class="actions"><button id="startCamera" class="primary" type="button">📷 カメラを起動</button><button id="takePhoto" class="primary" type="button" disabled>撮影する</button><label class="secondary">写真を選ぶ<input id="fileInput" type="file" accept="image/*" capture="environment" hidden></label></div><canvas id="canvas" hidden></canvas><button id="analyze" class="wide" type="button" disabled>この商品をAIで調べる</button></section><section id="results" hidden><div class="sectionHead"><h2>AI解析結果</h2><button id="newSearch" class="small" type="button">やり直す</button></div><div id="resultList"></div></section><section id="detail" hidden><button id="back" class="back" type="button">← 戻る</button><div id="detailBody"></div></section></main><script src="./app.js?v=20261008-18"></script></body></html>
